name: Luacheck
on:
  pull_request:
  push:
    branches: [main]
env:
  # renovate: datasource=github-tags depName=lua/lua versioning=semver extractVersion=^v(?<version>.*)$
  LUA_VERSION: "5.4.8"
jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ env.LUA_VERSION }}
      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6
      - name: Install luacheck
        run: luarocks install luacheck
      - name: Run luacheck
        run: luacheck .
